.tw{animation:tw 3s ease-in-out infinite}@keyframes tw{0%,100%{opacity:.35}50%{opacity:1}}
.bob{animation:bob 3.6s ease-in-out infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
